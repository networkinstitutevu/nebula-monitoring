receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs: 
        - job_name: 'traefik'
          scrape_interval: 10s
          static_configs:
            - targets: ['traefik:8082']
            - labels:
                container: 'traefik'

        - job_name: 'node-exporter'
          scrape_interval: 10s
          static_configs:
            - targets: ['node-exporter:9100']
            - labels:
                container: 'node-exporter'

        - job_name: 'dcgm'
          scrape_interval: 10s
          static_configs:
            - targets: ['dcgm-exporter:9400']
            - labels: 
                container: 'dcgm-exporter'

        - job_name: 'cadvisor'
          scrape_interval: 10s
          static_configs:
            - targets: ['cadvisor-exporter:8080']
            - labels: 
                container: 'cadvisor-exporter'


processors:
  batch:

  attributes:
    actions:
      - key: host
        value: ${HOSTNAME}
        action: upsert


exporters:
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write # TODO: Change with central prometheus instance
    tls:
      insecure: true


service:
  pipelines:
    metrics:
      receivers: [otlp, prometheus]
      processors: [attributes, batch]
      exporters: [prometheusremotewrite]
